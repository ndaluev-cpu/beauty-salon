<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель | MODA</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #b56581 0%, #d4819a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            margin: 20px;
        }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #d4819a;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .login-logo p { color: #888; font-size: 14px; margin-top: 5px; }
        .form-control {
            height: 50px;
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 0 15px;
            font-size: 14px;
        }
        .form-control:focus {
            border-color: #d4819a;
            box-shadow: 0 0 0 3px rgba(212,129,154,0.15);
        }
        .btn-login {
            background: #d4819a;
            border: none;
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            color: #fff;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: #b56581;
            transform: translateY(-2px);
            color: #fff;
        }
        .alert { border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <h1>MODA</h1>
            <p>Вход в админ-панель</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control"
                       placeholder="Имя пользователя" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control"
                       placeholder="Пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Войти</button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            Доступ только для администратора салона
        </p>
    </div>
</body>
</html>
