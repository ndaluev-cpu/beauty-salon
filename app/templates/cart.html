{% extends "base.html" %}
{% block title %}Ваша заявка — MODA{% endblock %}

{% block content %}
<div class="site-section">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h1 class="mb-0" style="font-family:'Playfair Display',serif;">Ваша заявка</h1>
            <a href="{{ url_for('public.catalog') }}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-arrow-left"></i> Продолжить выбор
            </a>
        </div>

        <div id="cartContent"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const box = document.getElementById('cartContent');

    function render() {
        const items = Cart.items || [];

        // ── Пустое состояние ────────────────────────────────
        if (!items.length) {
            box.innerHTML = `
                <div class="text-center py-5 bg-white rounded shadow-sm">
                    <i class="bi bi-bag-x" style="font-size:3rem;color:#d4819a;"></i>
                    <h4 class="mt-3">Заявка пуста</h4>
                    <p class="text-muted">Выберите услуги — мы свяжемся для подтверждения</p>
                    <a href="{{ url_for('public.catalog') }}" class="btn mt-2"
                       style="background:#d4819a; border-color:#d4819a; color:#fff;">
                        Перейти к услугам
                    </a>
                </div>`;
            return;
        }

        // ── Список позиций + итог ───────────────────────────
        box.innerHTML = `
        <div class="row">
            <div class="col-lg-8">
                ${items.map(i => `
                <div class="d-flex bg-white p-3 mb-3 rounded shadow-sm align-items-center flex-wrap gap-2">
                    <img src="${i.image || '/static/images/placeholder.jpg'}"
                         style="width:80px; height:80px; object-fit:cover; border-radius:8px;"
                         onerror="this.src='/static/images/placeholder.jpg'">
                    <div class="ms-3 flex-grow-1" style="min-width:140px;">
                        <h5 class="mb-1">${i.name}</h5>
                        ${(i.size || i.color) ? `
                            <div class="text-muted small">
                                ${i.size ? i.size : ''}${i.size && i.color ? ' · ' : ''}${i.color ? i.color : ''}
                            </div>` : ''}
                        <div class="fw-bold mt-1" style="color:#b56581;">
                            ${i.price} ₽
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <button class="btn btn-sm btn-outline-secondary"
                                onclick="changeQty(${i.id}, ${i.quantity - 1})">−</button>
                        <span class="mx-3">${i.quantity}</span>
                        <button class="btn btn-sm btn-outline-secondary"
                                onclick="changeQty(${i.id}, ${i.quantity + 1})">+</button>
                    </div>
                    <button class="btn btn-sm btn-link text-danger ms-2"
                            onclick="removeItem(${i.id})"
                            title="Удалить">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>`).join('')}

                <div class="mt-3">
                    <button class="btn btn-sm btn-outline-secondary"
                            onclick="clearAll()">
                        <i class="bi bi-x-circle"></i> Очистить заявку
                    </button>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="bg-white p-4 rounded shadow-sm">
                    <h4 class="mb-3">Итого</h4>
                    <h2 style="color:#b56581; font-weight:700;">
                        ${Cart.getTotal()} ₽
                    </h2>
                    <p class="text-muted small mb-3">
                        ${Cart.getCount()} ${plural(Cart.getCount(), 'услуга', 'услуги', 'услуг')}
                    </p>
                    <a href="/checkout" class="btn w-100"
                       style="background:#d4819a; border-color:#d4819a; color:#fff;">
                        Оформить заявку
                    </a>
                    <p class="text-muted small text-center mt-3 mb-0">
                        Мы свяжемся с вами для подтверждения
                    </p>
                </div>
            </div>
        </div>`;
    }

    // ── Действия ────────────────────────────────────────────
    window.changeQty = (id, qty) => {
        Cart.updateQuantity(id, qty);
        render();
    };

    window.removeItem = (id) => {
        Cart.remove(id);
        render();
    };

    window.clearAll = () => {
        if (!confirm('Очистить заявку полностью?')) return;
        Cart.clear();
        render();
    };

    // ── Плюрализация: 1 услуга / 2 услуги / 5 услуг ────────
    function plural(n, one, few, many) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return one;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
        return many;
    }

    // Первый рендер
    render();
});
</script>
{% endblock %}
